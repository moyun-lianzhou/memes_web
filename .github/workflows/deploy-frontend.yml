name: 前端自动打包并部署到服务器
on:
  push:
    branches: [main]  # 监听主分支推送
    paths:  # 只在前端源代码变动时触发（排除无关文件）
      - "src/**"
      - "public/**"
      - "vite.config.js"
      - "package.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取前端源代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 Node.js 和依赖
      - name: 配置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20  # 与你的本地 Node 版本一致
          cache: "npm"      # 缓存依赖，加速构建

      - name: 安装依赖
        run: npm ci  # 比 npm install 更严格，确保依赖版本一致

      # 3. 打包生成 dist（根据你的 vite 配置调整命令）
      - name: 打包前端代码
        run: npm run build  # 最终生成 dist 目录

      # 4. 将 dist 推送到服务器（宝塔面板对应的前端目录）
      - name: 部署到服务器
        uses: appleboy/scp-action@master  # 通过 SCP 传输文件
        with:
          host: ${{ secrets.SSH_HOST }}    # 服务器 IP（在 GitHub 仓库配置秘钥）
          username: ${{ secrets.SSH_USER }}# 服务器用户名（如 root）
          key: ${{ secrets.SSH_PRIVATE_KEY }}# 服务器 SSH 私钥（安全存储在 GitHub Secrets）
          source: "dist/*"                 # 要传输的产物目录
          target: "/www/wwwroot/你的前端域名/"  # 宝塔面板中前端站点的根目录（如 /www/wwwroot/my-frontend/）