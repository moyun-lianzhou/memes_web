server {
    listen 80;  # 容器内端口，必须和 Dockerfile 的 EXPOSE 一致
    server_name localhost;

    # 静态文件根目录（必须和你复制 dist 的路径一致）
    root /usr/share/nginx/html;
    index index.html;  # 默认加载 index.html

    # 解决前端路由（如 React Router）刷新 404 问题（可选）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}