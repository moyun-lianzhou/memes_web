# --------------------------

# 访问 HTTP 时重定向到 HTTPS

# --------------------------

server {
    listen 80; # 监听 80 端口（HTTP）
    server_name moyunlianzhou.cn www.moyunlianzhou.cn; # 绑定的域名
    return 301 https://$host$request_uri; # 301 永久重定向到 HTTPS
}

# --------------------------

# HTTPS 主服务配置

# --------------------------

server {
    listen 443 ssl; # 监听 443 端口（HTTPS）
    server_name moyunlianzhou.cn www.moyunlianzhou.cn;  # 绑定域名
    

    # SSL 证书路径
    ssl_certificate /etc/nginx/ssl/moyunlianzhou.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/moyunlianzhou.cn.key;
    
    # SSL 协议与加密套件
    ssl_protocols TLSv1.2 TLSv1.3; # 只支持安全的 TLS 协议版本
    # 加密套件优先级
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256;
    ssl_prefer_server_ciphers on; # 优先使用服务器定义的加密套件
    ssl_session_cache shared:SSL:10m; # SSL 会话缓存（共享内存）
    ssl_session_timeout 10m; # SSL 会话超时时间
    
    # 浏览器 HSTS 强制 HTTPS（有效期 1 年）
    add_header Strict-Transport-Security "max-age=31536000" always;
    
    root /usr/share/nginx/html; # 前端静态资源根目录（Vue/React 打包后的 dist）

    index index.html index.htm;  # 默认索引文件
    
    # 后端API反向代理（/api路径）
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;  # 转发到 Node.js 3000 端口
        proxy_set_header Host $host; # 传递原始 Host 头
        proxy_set_header X-Real-IP $remote_addr; # 传递客户端真实 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 传递代理链 IP
        proxy_set_header X-Forwarded-Proto $scheme; # 传递协议（http/https）
        
        # WebSocket 支持（API 若有 WS 可保留）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
    
    # 优先匹配 /uploads/ 反向代理（图片等上传资源）
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3000;  # 转发到 Node.js 3000 端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        break; # 匹配后停止搜索其他规则
    }
    
    # 静态资源缓存（不含 /uploads/）- 图片缓存 30 天
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d; # 浏览器缓存 30 天（Expires 头）
        add_header Cache-Control "public, max-age=2592000"; # 30 天 = 2592000 秒
        access_log off; # 静态资源关闭访问日志
    }
    
    # 静态资源缓存（不含 /uploads/） - CSS/JS 缓存 1 年（必须配合文件 hash 版本号）
    location ~* \.(js|css)$ {
        expires 1y; # 浏览器缓存 1 年
        add_header Cache-Control "public, max-age=31536000"; # 1 年 = 31536000 秒
        access_log off;
    }
    
    # 防止直接访问后端文件
    location ~ /memos_server/ {
        deny all; # 拒绝访问
        return 403; # 返回 403 Forbidden
    }
    
    # 处理前端路由（Vue/React单页应用）
    location / {
        # 找不到文件时返回 index.html，针对与history路由模式的配置
        try_files $uri $uri/ /index.html; 
    }
    
    # ======================
    # gzip 压缩配置
    # ======================
    gzip on;  # 开启 gzip 压缩
    gzip_vary on;  # 告诉代理/CDN 区分压缩版本
    gzip_proxied any;  # 对代理请求也压缩
    gzip_comp_level 6;  # 压缩等级 1-9，6 是较优平衡
    gzip_buffers 16 8k;  # 压缩缓冲区
    gzip_http_version 1.1;  # 支持的 HTTP 版本
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
}