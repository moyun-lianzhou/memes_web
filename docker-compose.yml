version: '3.8' # 声明 Docker Compose 文件的版本为 3.8，这是较新的版本，支持大多数现代 Docker 功能。
services:
  frontend: # 定义一个服务，名字叫 frontend，你可以理解为“启动一个容器”。
    build: . # 告诉 Docker Compose：用当前目录下的 Dockerfile 构建镜像，也就是你刚才那个多阶段构建的镜像。
    ports:
      - "443:443"  # 宿主机 443 端口 → 容器 443 端口（HTTPS）
      - "80:80"    # 宿主机 80 端口 → 容器 80 端口（HTTP，可选，用于重定向）
    restart: always # 容器异常退出时，自动重启，确保服务一直运行。
    # 重点：添加 volumes 配置，挂载宿主机证书目录到容器内
    volumes:
      - /opt/ssl-cert:/etc/nginx/ssl  # 宿主机路径:容器内路径